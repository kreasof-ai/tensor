name: WebGPU producer and compiler-free transfer

on:
  push:
    paths: ["src/**", "tests/test_webgpu*.py", "examples/**", "tools/webgpu*.py", "pyproject.toml", "uv.lock", ".github/workflows/phase5-webgpu.yml"]
  pull_request:
    paths: ["src/**", "tests/test_webgpu*.py", "examples/**", "tools/webgpu*.py", "pyproject.toml", "uv.lock", ".github/workflows/phase5-webgpu.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - name: GPU-free WGSL envelope and TIRx producer checks
        run: uv run --locked python -m pytest tests/test_webgpu.py tests/test_webgpu_audit.py -o addopts='' -q
      - name: Build the inference suite without a device or vendor compiler
        run: uv run --locked python tools/webgpu_validation.py --build build/transfer
      - name: Package the optional native consumer
        run: uv build --wheel --out-dir build/transfer/wheel
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tensor-webgpu-${{ matrix.os }}
          path: |
            build/transfer/module
            build/transfer/validation.tpack
            build/transfer/suite.json
            build/transfer/wheel
          if-no-files-found: error
          retention-days: 30

  software-consumer:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.9"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tensor-webgpu-windows-latest
          path: build/transfer
      - name: Install Vulkan software adapter and isolated runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          uv venv --python 3.12 build/consumer
          uv pip install --python build/consumer/bin/python "build/transfer/wheel/tensor_workspace-0.1.0-py3-none-any.whl[webgpu]"
      - name: Execute Windows-produced WGSL and packaged modules without compiler imports
        run: build/consumer/bin/python tools/webgpu_validation.py --consume build/transfer --iters 3 --out build/consumer-result.json
      - name: Audit coverage, source identities and software classification
        run: build/consumer/bin/python tools/webgpu_audit.py --suite build/transfer/suite.json --result build/consumer-result.json --allow-software
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tensor-webgpu-software-evidence
          path: build/consumer-result.json
          if-no-files-found: error
          retention-days: 30
