name: Distribution checks

on:
  push:
    paths: ["src/**", "packages/**", "examples/**", "scripts/validation/distribution_check.py", "pyproject.toml", "setup.py", "uv.lock", "LICENSE", "README.md", ".github/workflows/distribution.yml"]
  pull_request:
    paths: ["src/**", "packages/**", "examples/**", "scripts/validation/distribution_check.py", "pyproject.toml", "setup.py", "uv.lock", "LICENSE", "README.md", ".github/workflows/distribution.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.9"
      - name: Check the documented runtime-only install
        run: |
          uv sync --locked --no-default-groups
          uv run --locked --no-default-groups tensor --version
          uv run --locked --no-default-groups tensor --help
      - name: Build and verify all distributions without a GPU or compiler stack
        run: uv run --locked --no-default-groups python scripts/validation/distribution_check.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tensor-distributions-${{ matrix.os }}
          path: |
            build/distributions/*.whl
            build/distributions/*.tar.gz
          if-no-files-found: error
          retention-days: 30
