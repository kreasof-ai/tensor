name: Standalone LFM2 package and NVRTC plans
on:
  push:
    paths: ["packages/tensor-llm/**", "benchmarks/lfm2/**", "src/**", "pyproject.toml", "uv.lock", ".github/workflows/lfm2-inference.yml"]
  pull_request:
    paths: ["packages/tensor-llm/**", "benchmarks/lfm2/**", "src/**", "pyproject.toml", "uv.lock", ".github/workflows/lfm2-inference.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  producer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TENSOR_NVRTC_HOME: ${{ github.workspace }}/build/nvrtc-12.9
      CUDA_HOME: ${{ github.workspace }}/build/no-system-toolkit
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest packages/tensor-llm/tests -o addopts='' -q
      - run: uv run --locked python tools/bootstrap_nvrtc.py --out build/nvrtc-12.9
      - run: uv run --locked python benchmarks/lfm2/diagnostic.py --out build/lfm2-diagnostic.gguf
      - run: uv run --locked python benchmarks/lfm2/producer.py --model build/lfm2-diagnostic.gguf --out build/lfm2-diagnostic --context 384 --target sm_86
      - name: Compile the Vulkan-to-CUDA transfer profile without a GPU
        run: uv run --locked python benchmarks/lfm2/producer.py --model build/lfm2-diagnostic.gguf --out build/lfm2-cuda-transfer/diagnostic-optimized --context 384 --target sm_86 --cuda-profile optimized --prefill-chunks 32 128
      - name: Compile the guarded CUDA suffix templates
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          import tensor
          from tensor_llm.cuda_kernels import source
          out=Path('build/lfm2-cuda-suffix');out.mkdir(parents=True,exist_ok=True)
          specs={
              'qnorm':dict(r=8,h=4,kh=2,d=64,cap=448,eps=1e-5,theta=10000),
              'kvnorm':dict(r=128,h=4,kh=2,d=64,cap=448,eps=1e-5,theta=10000),
              'prefill_tail':dict(r=128,c=17,t=8),
          }
          for kind,parameters in specs.items():
              path=out/(kind+'.py');path.write_text(source(kind,parameters))
              tensor.build(path,path.with_suffix('.tbin'),compiler='nvrtc',target='sm_86')
          PY
      - name: Compile the F16, Q4_0, Q4_K_M schedules and grouped attention without a GPU
        run: uv run --locked python benchmarks/lfm2/cuda_formats.py compile-templates
      - name: Compile experimental FP16 decode schedules with NVRTC
        run: |
          uv run --locked python benchmarks/lfm2/fp16_decode.py bundle --base build/lfm2-diagnostic --out build/lfm2-diagnostic-cast --mode fp16_cast
          uv run --locked python benchmarks/lfm2/fp16_decode.py bundle --base build/lfm2-diagnostic --out build/lfm2-diagnostic-half2 --mode fp16_half2
          uv run --locked python benchmarks/lfm2/fp16_decode.py bundle --base build/lfm2-diagnostic --out build/lfm2-diagnostic-mma --mode fp16_mma32
      - name: Compile split-KV and packed-load experiments without a GPU
        shell: bash
        run: |
          uv run --locked python benchmarks/lfm2/decode_optimization.py --base build/lfm2-diagnostic --out build/lfm2-diagnostic-warp-split --splits 16
          uv run --locked python - <<'PYCODE'
          from pathlib import Path
          from benchmarks.lfm2.decode_optimization import compile_source, pipelined_source, prefetch_source
          out=Path('build/lfm2-packed-load-controls')
          for encoding in (2,12,14):
              p={'r':1,'k':2048,'o':128,'type':encoding}
              for asynchronous in (False,True):
                  compile_source(pipelined_source(p,async_load=asynchronous),out)
              compile_source(prefetch_source(p),out)
          PYCODE
      - run: uv build --wheel --out-dir build/lfm2-wheels
      - run: uv build --wheel packages/tensor-llm --out-dir build/lfm2-wheels
      - name: Inspect in an isolated consumer with four distributions
        shell: bash
        run: |
          uv venv --python 3.12 build/consumer
          if [ "${{ runner.os }}" = "Windows" ]; then
            consumer_python=build/consumer/Scripts/python.exe
          else
            consumer_python=build/consumer/bin/python
          fi
          uv pip install --python "$consumer_python" build/lfm2-wheels/*.whl
          "$consumer_python" - <<'PY'
          import importlib.metadata as metadata
          import sys
          from tensor_llm import GGUF, Tokenizer
          from tensor_llm.config import Config
          from tensor_llm.provenance import implementation_hashes
          import json
          from pathlib import Path
          g=GGUF('build/lfm2-diagnostic.gguf')
          assert len(Config.from_gguf(g).layers)==2
          t=Tokenizer(g.metadata)
          assert t.decode(t.encode('Hello, 世界!',add_bos=False))=='Hello, 世界!'
          manifest=json.loads(Path('build/lfm2-diagnostic/inference.json').read_text())
          assert manifest['implementation']==implementation_hashes()
          optimized=json.loads(Path('build/lfm2-cuda-transfer/diagnostic-optimized/inference.json').read_text())
          assert optimized['implementation']==implementation_hashes()
          assert optimized['cuda_profile']=='optimized'
          assert optimized['rows']==[1,32,128]
          assert {d.metadata['Name'].lower() for d in metadata.distributions()}=={'tensor-workspace','tensor-llm','numpy','regex'}
          assert not {'tilelang','tvm','tvm_ffi','torch','triton','wgpu'} & sys.modules.keys()
          PY
          "$consumer_python" -m tensor_llm inspect --model build/lfm2-diagnostic.gguf
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tensor-lfm2-${{ matrix.os }}
          path: |
            build/lfm2-diagnostic.gguf
            build/lfm2-diagnostic/inference.json
            build/lfm2-diagnostic/artifacts/*.tbin
            build/lfm2-diagnostic-half2/inference.json
            build/lfm2-diagnostic-half2/artifacts/*.tbin
            build/lfm2-diagnostic-warp-split/inference.json
            build/lfm2-diagnostic-warp-split/artifacts/*.tbin
            build/lfm2-cuda-transfer/diagnostic-optimized/inference.json
            build/lfm2-cuda-transfer/diagnostic-optimized/artifacts/*.tbin
            build/lfm2-packed-load-controls/*.tbin
            build/lfm2-cuda-suffix/*.tbin
            build/lfm2-cuda-formats/template-checks/*.tbin
            build/lfm2-cuda-formats/template-checks/coverage.json
            build/lfm2-wheels/*.whl
          if-no-files-found: error
          retention-days: 30
