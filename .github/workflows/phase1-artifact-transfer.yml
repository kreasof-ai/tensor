name: Phase 1 Tensor artifact producer

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Exact SM reported by the consumer
        required: true
        default: sm_86

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_HOME: ${{ github.workspace }}/build/cuda-12.9
      TENSOR_TARGET: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.9"
          enable-cache: false
      - name: Install the producer and CUDA build components
        run: |
          uv sync --locked
          uv run --locked python tools/bootstrap_cuda.py --out "$CUDA_HOME"
          uv run --locked tensor doctor --target "$TENSOR_TARGET" --compiler nvcc
      - name: Run the product signature, ownership and diagnostic guards
        run: |
          uv run --locked python -m pytest -o addopts='' -q \
            tests/runtime/test_signature.py tests/runtime/test_dlpack.py tests/artifacts/test_product_artifact.py \
            tests/compiler/test_build.py tests/integration/test_doctor.py
      - name: Build the product artifact and consumer wheel without a GPU
        run: |
          for example in elementwise gemm_relu dynamic_affine dynamic_gemm scalar_offset; do
            uv run --locked tensor build "examples/$example.py" \
              --target "$TENSOR_TARGET" --compiler nvcc --out "build/transfer/$example.tbin"
          done
          uv build --wheel
          uv run --locked python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          artifact = pathlib.Path("build/transfer/elementwise.tbin")
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          report = {
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "git_dirty": bool(subprocess.check_output(["git", "status", "--porcelain"], text=True).strip()),
              "host": os.uname().nodename,
              "python": platform.python_version(),
              "lock_sha256": hashlib.sha256(pathlib.Path("uv.lock").read_bytes()).hexdigest(),
              "target": os.environ["TENSOR_TARGET"],
              "artifact_sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              "artifacts": {path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                            for path in sorted(artifact.parent.glob("*.tbin"))},
              "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "wheel": wheel.name,
          }
          artifact.with_name("producer.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tensor-cuda-${{ inputs.arch }}
          path: |
            build/transfer/*.tbin
            build/transfer/producer.json
            dist/*.whl
          if-no-files-found: error
          retention-days: 30

  consumer-install-smoke:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: build/consumer-venv/bin/python
          - os: windows-latest
            python: build/consumer-venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.9"
          enable-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tensor-cuda-${{ inputs.arch }}
          path: build/transfer-smoke
      - name: Install downloaded wheel without compiler packages
        shell: bash
        run: |
          uv venv --python 3.12 build/consumer-venv
          uv pip install --python "${{ matrix.python }}" \
            build/transfer-smoke/dist/tensor_workspace-0.1.0-py3-none-any.whl
          "${{ matrix.python }}" - <<'PY'
          import hashlib
          import importlib.metadata as metadata
          import json
          import pathlib
          import sys

          from tensor.artifact import read_artifact

          root = pathlib.Path("build/transfer-smoke")
          report = json.loads((root / "build/transfer/producer.json").read_text())
          wheel = root / "dist" / report["wheel"]
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == report["wheel_sha256"]
          for name, digest in report["artifacts"].items():
              artifact = root / "build/transfer" / name
              assert hashlib.sha256(artifact.read_bytes()).hexdigest() == digest
              manifest, _ = read_artifact(artifact)
              assert manifest["target"] == report["target"]
              assert manifest["format_version"] in (2, 3)
          installed = {item.metadata["Name"].lower() for item in metadata.distributions()}
          assert installed == {"numpy", "tensor-workspace"}, installed
          assert not {"tilelang", "tvm", "torch"} & sys.modules.keys()
          print(json.dumps({"status": "passed", "platform": sys.platform,
                            "packages": sorted(installed), "target": manifest["target"],
                            "artifacts": sorted(report["artifacts"])}))
          PY
