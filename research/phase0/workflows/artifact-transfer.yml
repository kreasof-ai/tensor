name: P0 artifact transfer producer

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Exact SM reported by the consumer
        required: true
        default: sm_86

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_HOME: ${{ github.workspace }}/experiments/p0/out/cuda-12.9
      TILELANG_DISABLE_CACHE: "1"
      P0_TARGET_ARCH: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.9"
          enable-cache: false
      - name: Install the locked producer and CUDA build components
        run: |
          uv sync --locked
          uv run --locked python tools/bootstrap_cuda.py --out "$CUDA_HOME"
          uv run --locked python -m experiments.p0.artifact_build doctor --arch "$P0_TARGET_ARCH"
      - name: Build the boundary-size matrix without a GPU
        run: |
          uv run --locked python - <<'PY'
          import json, os, pathlib, platform
          from experiments.p0.artifact_build import main
          import sys
          root = pathlib.Path("experiments/p0/out/transfer")
          root.mkdir(parents=True)
          for size in (1, 127, 128, 129, 1025):
              sys.argv = ["artifact_build", "build", "--size", str(size), "--arch", os.environ["P0_TARGET_ARCH"], "--out", str(root / f"elementwise-{size}.tbin")]
              if main():
                  raise SystemExit(1)
          from experiments.p0.provenance import snapshot
          (root / "build-host.json").write_text(json.dumps({"producer": snapshot(), "host": platform.platform(), "actions_run_id": os.environ["GITHUB_RUN_ID"]}, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: p0-cubins-${{ inputs.arch }}
          path: experiments/p0/out/transfer/
          if-no-files-found: error
          retention-days: 30
