[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-llm"
version = "0.1.0"
description = "Standalone GGUF LFM2 inference on Tensor"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3.12"]
requires-python = ">=3.12,<3.13"
dependencies = ["tensor-workspace==0.1.0", "regex==2026.9.29"]

[project.urls]
Repository = "https://github.com/kreasof-ai/tensor"
Documentation = "https://github.com/kreasof-ai/tensor/blob/main/packages/tensor-llm/README.md"
Issues = "https://github.com/kreasof-ai/tensor/issues"

[project.scripts]
tensor-llm = "tensor_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
