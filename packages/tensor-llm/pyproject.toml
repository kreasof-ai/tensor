[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-llm"
version = "0.1.0"
description = "Standalone GGUF LFM2 inference on Tensor"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["tensor-workspace==0.1.0", "regex==2026.9.29"]

[project.scripts]
tensor-llm = "tensor_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
