[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-nn"
version = "0.1.0"
description = "Native Tensor neural-network module templates with a nanoGPT example"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3.12"]
requires-python = ">=3.12,<3.13"
dependencies = ["tensor-workspace==0.1.0"]

[project.urls]
Repository = "https://github.com/kreasof-ai/tensor"
Documentation = "https://github.com/kreasof-ai/tensor/blob/main/packages/tensor-nn/README.md"
Issues = "https://github.com/kreasof-ai/tensor/issues"

[tool.setuptools]
packages = ["tensor_nn", "tensor_nn.templates", "tensor_nn.kernels",
            "tensor_nn_examples", "tensor_nn_examples.nanogpt"]

[tool.setuptools.package-dir]
"" = "src"
tensor_nn_examples = "examples"
