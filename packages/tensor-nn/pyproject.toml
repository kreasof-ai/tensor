[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-nn"
version = "0.1.0"
description = "Optional manual training templates for Tensor"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["tensor-workspace==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
