[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-torch"
version = "0.1.0"
description = "PyTorch client adapter and NVRTC FX backend for Tensor"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3.12"]
requires-python = ">=3.12,<3.13"
dependencies = ["tensor-workspace==0.1.0", "torch>=2.8,<2.15"]

[project.urls]
Repository = "https://github.com/kreasof-ai/tensor"
Documentation = "https://github.com/kreasof-ai/tensor/blob/main/docs/guides/pytorch.md"
Issues = "https://github.com/kreasof-ai/tensor/issues"

[project.entry-points.torch_dynamo_backends]
tensor = "tensor_torch:backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tensor_torch = ["templates/*.py", "*.c", "*.cpp"]
