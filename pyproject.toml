[project]
name = "tensor-workspace"
version = "0.1.0"
description = "Development workspace for the Tensor tensor-program runtime and compiler product layer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.3"]

[project.optional-dependencies]
compiler = ["tilelang==0.1.14", "apache-tvm-ffi==0.1.12"]
publish = ["twine>=6.2,<8"]
webgpu = ["wgpu==0.29.0"]

[project.scripts]
tensor = "tensor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tensor = ["include/tensor/*.h", "native/*.cpp", "native/*.rs"]

# Keep the historical p0 group as the pinned producer stack. Ordinary runtime
# dependencies stay minimal; optional training templates are a workspace member.
[dependency-groups]
p0 = [
    "tilelang==0.1.14",
    "apache-tvm-ffi==0.1.12",
    "numpy==2.5.3",
]
dev = [
    "pytest>=8.0",
    "tensor-nn==0.1.0",
]

[tool.uv.workspace]
members = ["packages/tensor-nn"]

[tool.uv.sources]
tensor-workspace = { workspace = true }
tensor-nn = { workspace = true }

[tool.uv]
# TileLang's transitive dependencies are recorded in uv.lock. The compiler-free
# consumer is tested in a separate environment containing only NumPy.
default-groups = ["p0", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/tensor-nn/tests", "packages/tensor-torch/tests"]
addopts = "-q"
pythonpath = ["."]
