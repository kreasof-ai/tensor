[project]
name = "tensor-workspace"
version = "0.1.0"
description = "Build, package, and run tensor kernels with a lightweight runtime"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["tensor", "gpu", "cuda", "tilelang", "webgpu", "kernels"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.3"]

[project.urls]
Homepage = "https://github.com/akbar2habibullah/tensor"
Documentation = "https://github.com/akbar2habibullah/tensor/blob/main/docs/README.md"
Repository = "https://github.com/akbar2habibullah/tensor"
Issues = "https://github.com/akbar2habibullah/tensor/issues"
Changelog = "https://github.com/akbar2habibullah/tensor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
compiler = ["tilelang==0.1.14", "apache-tvm-ffi==0.1.12"]
publish = ["twine>=6.2,<8"]
webgpu = ["wgpu==0.29.0"]

[project.scripts]
tensor = "tensor.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tensor = ["include/tensor/*.h", "native/*.cpp", "native/*.rs", "native/*.c"]

# Keep the historical p0 group as the pinned producer stack. Ordinary runtime
# dependencies stay minimal; optional training templates are a workspace member.
[dependency-groups]
p0 = [
    "tilelang==0.1.14",
    "apache-tvm-ffi==0.1.12",
    "numpy==2.5.3",
]
dev = [
    "pytest>=8.0",
    "tensor-nn==0.1.0",
    "tensor-llm==0.1.0",
]

[tool.uv.workspace]
members = ["packages/tensor-nn", "packages/tensor-llm"]

[tool.uv.sources]
tensor-workspace = { workspace = true }
tensor-nn = { workspace = true }
tensor-llm = { workspace = true }

[tool.uv]
# TileLang's transitive dependencies are recorded in uv.lock. The compiler-free
# consumer is tested in a separate environment containing only NumPy.
default-groups = ["p0", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/tensor-nn/tests", "packages/tensor-torch/tests", "packages/tensor-llm/tests"]
addopts = "-q"
pythonpath = ["."]
